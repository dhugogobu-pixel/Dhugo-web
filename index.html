<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHUGO QUIZ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎓 DHUGO QUIZ</h1>
    <p>Grade 9 • Mathematics • Chapter 1</p>
  </header>

  <main class="container">

    <section id="start-screen" class="card">
      <h2>Welcome to DHUGO QUIZ 👋</h2>
      <p>Test your Grade 9 Mathematics knowledge with 20 questions.</p>
      <button onclick="startQuiz()">Start Quiz 🚀</button>
    </section>

    <section id="quiz-screen" class="card hidden">

      <div class="top">
        <span id="progress">Question 1 of 20</span>
        <span id="score">Score: 0</span>
      </div>

      <div class="bar">
        <div id="bar-fill"></div>
      </div>

      <h2 id="question"></h2>

      <div id="answers"></div>

      <button id="next-btn" onclick="nextQuestion()" disabled>
        Next ➜
      </button>

    </section>

    <section id="result-screen" class="card hidden">
      <h2>🎉 Quiz Completed!</h2>

      <div id="result"></div>

      <button onclick="restartQuiz()">
        Try Again 🔄
      </button>
    </section>

  </main>

  <footer>
    Created by Dhugo Gobu • DHUGO QUIZ
  </footer>

  <script src="script.js"></script>

</body>
</html>
